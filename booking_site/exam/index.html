<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title id="pageTitle">امتحان إلكتروني</title>
<link id="favicon" rel="icon" href="data:," />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4F46E5;
    --primary-2:#7C3AED;
    --primary-dark:#3730A3;
    --ink:#0F172A;
    --muted:#64748B;
    --line:#E7E9F3;
    --card:#FFFFFF;
    --bg:#F1F2F9;
    --danger:#EF4444;
    --success:#10B981;
    --amber:#F59E0B;
    --r:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;}
  body{
    font-family:'Cairo',sans-serif;
    background:
      radial-gradient(120% 55% at 100% 0%, #EEF0FE 0%, rgba(238,240,254,0) 60%),
      radial-gradient(120% 55% at 0% 0%, #F3E9FF 0%, rgba(243,233,255,0) 55%),
      var(--bg);
    min-height:100dvh;width:100%;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    padding:26px 14px 90px;
  }
  .wrap{width:100%;max-width:500px;}

  /* ── الترويسة ─────────────────────────── */
  .hero{text-align:center;margin-bottom:18px;}
  .hero-icon{
    width:66px;height:66px;border-radius:20px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;font-size:28px;color:#fff;
    box-shadow:0 14px 30px rgba(79,70,229,.32),inset 0 1px 0 rgba(255,255,255,.25);
  }
  .hero-title{font-size:19px;font-weight:900;margin:0 0 3px;letter-spacing:-.2px;}
  .hero-sub{font-size:12.5px;color:var(--muted);margin:0;font-weight:600;}

  /* ── الكارت ───────────────────────────── */
  .card{
    background:var(--card);border-radius:var(--r);
    box-shadow:0 20px 50px rgba(15,23,42,.09),0 2px 8px rgba(15,23,42,.04);
    border:1px solid rgba(255,255,255,.7);
    padding:22px;animation:pop .3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:none;}}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:800;color:var(--ink);margin-bottom:7px;}
  .field input{
    width:100%;padding:15px 14px;border-radius:14px;border:1.6px solid var(--line);
    font-family:'Cairo';font-size:17px;font-weight:700;background:#F8F9FD;color:var(--ink);
    text-align:center;letter-spacing:2px;transition:border-color .15s,background .15s,box-shadow .15s;
  }
  .field input::placeholder{font-weight:500;letter-spacing:0;color:#AAB1C4;}
  .field input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.12);}
  .hint{font-size:11px;color:var(--muted);margin:-6px 2px 14px;line-height:1.6;font-weight:600;}

  .btn{
    width:100%;padding:16px;border-radius:15px;border:none;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;font-family:'Cairo';font-weight:900;font-size:15.5px;cursor:pointer;
    box-shadow:0 12px 26px rgba(79,70,229,.30);
    transition:transform .1s,box-shadow .15s,opacity .15s;
  }
  .btn:disabled{opacity:.55;cursor:default;box-shadow:none;}
  .btn:not(:disabled):active{transform:translateY(1px) scale(.99);}
  .btn.sub{display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn .badge{background:rgba(255,255,255,.22);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:800;}

  .err{
    background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;
    padding:11px 12px;border-radius:12px;font-size:12px;margin-bottom:14px;text-align:center;font-weight:700;
  }

  /* ── شاشات الحالة ─────────────────────── */
  .state{text-align:center;padding:20px 8px;}
  .state .ring{
    width:78px;height:78px;border-radius:24px;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;font-size:36px;
  }
  .state.ok .ring{background:rgba(16,185,129,.12);}
  .state.wait .ring{background:rgba(245,158,11,.12);}
  .state.stop .ring{background:rgba(100,116,139,.12);}
  .state.err .ring{background:rgba(239,68,68,.12);}
  .state .t{font-weight:900;margin:0 0 7px;font-size:17px;}
  .state .s{font-size:12.5px;color:var(--muted);margin:0;line-height:1.8;font-weight:600;}

  .spinner{
    width:30px;height:30px;border:3px solid #E7E9F3;border-top-color:var(--primary);
    border-radius:50%;animation:spin .7s linear infinite;margin:26px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── اختيار الامتحان ──────────────────── */
  .pick-h{font-size:14px;font-weight:900;margin:0 0 14px;}
  .exam-pick{
    display:flex;align-items:center;gap:12px;width:100%;text-align:right;
    padding:14px;border-radius:15px;border:1.6px solid var(--line);
    background:#F8F9FD;margin-bottom:10px;cursor:pointer;font-family:'Cairo';
    transition:border-color .12s,background .12s,transform .08s;
  }
  .exam-pick:active{transform:scale(.99);}
  .exam-pick .pi{
    width:40px;height:40px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .exam-pick b{font-size:13.5px;font-weight:800;display:block;}
  .exam-pick small{color:var(--muted);font-size:11.5px;font-weight:600;}

  /* ── شريط الامتحان ───────────────────── */
  .xbar{
    position:sticky;top:0;z-index:20;margin:-22px -22px 4px;padding:14px 18px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;
  }
  .xbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .xbar-title{font-weight:900;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .timer{
    display:flex;align-items:center;gap:6px;flex-shrink:0;
    font-weight:900;font-size:15px;color:var(--primary-dark);font-variant-numeric:tabular-nums;
    background:rgba(79,70,229,.10);padding:6px 12px;border-radius:20px;
  }
  .timer.low{color:#fff;background:var(--danger);animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.7;}}
  .prog-wrap{margin-top:10px;}
  .prog-track{height:7px;border-radius:20px;background:#EDEEF6;overflow:hidden;}
  .prog-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .35s cubic-bezier(.2,.8,.2,1);}
  .prog-txt{font-size:10.5px;font-weight:800;color:var(--muted);margin-top:5px;text-align:left;}

  /* ── الأسئلة ─────────────────────────── */
  .qlist{padding-top:14px;}
  .q{
    border:1.4px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;
    background:#fff;transition:border-color .15s,box-shadow .15s;
  }
  .q.answered{border-color:rgba(79,70,229,.35);box-shadow:0 4px 14px rgba(79,70,229,.06);}
  .q-head{display:flex;gap:9px;margin-bottom:12px;}
  .q-num{
    flex-shrink:0;width:24px;height:24px;border-radius:8px;
    background:rgba(79,70,229,.10);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;
  }
  .q.answered .q-num{background:var(--primary);color:#fff;}
  .q-text{font-weight:800;font-size:13.5px;line-height:1.85;padding-top:2px;}
  .opt{
    display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:12px;
    border:1.6px solid var(--line);background:#F8F9FD;margin-bottom:8px;cursor:pointer;
    font-size:13.5px;font-weight:700;transition:border-color .12s,background .12s,transform .06s;
  }
  .opt:last-child{margin-bottom:0;}
  .opt:active{transform:scale(.995);}
  .opt input{position:absolute;opacity:0;pointer-events:none;}
  .opt .mark{
    flex-shrink:0;width:21px;height:21px;border-radius:50%;border:2px solid #CBD2E0;
    display:flex;align-items:center;justify-content:center;transition:all .12s;
  }
  .opt.sel{border-color:var(--primary);background:#EEF0FE;}
  .opt.sel .mark{border-color:var(--primary);background:var(--primary);}
  .opt.sel .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;}

  .sticky-sub{
    position:sticky;bottom:0;margin:14px -22px -22px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(255,255,255,0),#fff 32%);
  }
  .retry-note{font-size:11.5px;color:#B91C1C;text-align:center;margin-top:10px;font-weight:700;}

  /* ── شاشة تعريف الامتحان ─────────────────── */
  .brief{text-align:center;padding:10px 4px 4px;}
  .brief-ico{
    width:72px;height:72px;border-radius:22px;margin:0 auto 14px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;
    box-shadow:0 14px 30px rgba(79,70,229,.30);
  }
  .brief-title{font-size:18px;font-weight:900;margin:0 0 14px;line-height:1.6;}
  .brief-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px;}
  .brief-meta span{
    background:#F1F2FB;border:1px solid var(--line);border-radius:12px;
    padding:8px 12px;font-size:12px;font-weight:800;color:var(--ink);
  }
  .brief-hint{
    font-size:12px;color:var(--muted);line-height:1.9;margin:0 0 18px;font-weight:600;
    background:#F8F9FD;border-radius:14px;padding:12px 14px;
  }
  .brief-hint b{color:var(--primary-dark);}
  .grade-bar{height:8px;border-radius:20px;background:#EDEEF6;overflow:hidden;margin:12px auto 8px;max-width:220px;}
  .grade-bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--primary-2));}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-icon">📝</div>
    <p class="hero-title" id="heroTitle">امتحان إلكتروني</p>
    <p class="hero-sub" id="heroSub">أدخل بياناتك لبدء الامتحان</p>
  </div>
  <div class="card" id="card"><div class="spinner"></div></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, getDocFromServer, setDoc, collection, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqFLZ4kHEgPLVgLgDGbbIjxnZheBqMjMc",
    authDomain: "active-class-72e0f.firebaseapp.com",
    projectId: "active-class-72e0f",
    storageBucket: "active-class-72e0f.firebasestorage.app",
    messagingSenderId: "822461821604",
    appId: "1:822461821604:web:3bd266a9833ce045916c31",
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const card = document.getElementById('card');
  const heroTitle = document.getElementById('heroTitle');
  const heroSub = document.getElementById('heroSub');

  function getSlug(){
    const parts = window.location.pathname.split('/').filter(Boolean);
    const idx = parts.indexOf('exam');
    if (idx !== -1 && parts[idx + 1]) return parts[idx + 1];
    return parts[parts.length - 1] || '';
  }
  const slug = getSlug();

  function escapeHtml(str){ const d = document.createElement('div'); d.innerText = str ?? ''; return d.innerHTML; }
  function fmtTime(ms){
    if (ms < 0) ms = 0;
    const s = Math.floor(ms/1000);
    const m = Math.floor(s/60);
    return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }
  function fmtClock(d){
    try { return new Date(d).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'}); } catch(e){ return ''; }
  }
  // PRNG حتمي — نفس الترتيب المخلوط للطالب عبر إعادة التحميل/الاستئناف.
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function seedFromString(str){
    let h = 2166136261;
    for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function shuffled(arr, rnd){
    const a = arr.map((v,i)=>({v,i}));
    for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function stateScreen(ico,t,s,cls){
    card.innerHTML = `<div class="state ${cls||'ok'}"><div class="ring">${ico}</div><p class="t">${escapeHtml(t)}</p><p class="s">${escapeHtml(s)}</p></div>`;
  }

  // ── الحالة ──
  let ctx = { code:'', last4:'', groupName:'' };

  function renderForm(err){
    heroTitle.textContent = window.__teacherName || 'امتحان إلكتروني';
    heroSub.textContent = 'أدخل بياناتك لبدء الامتحان';
    card.innerHTML = `
      ${err ? `<div class="err">${escapeHtml(err)}</div>` : ''}
      <div class="field">
        <label>كود الطالب</label>
        <input id="codeInput" type="text" placeholder="مثال: A05" autocapitalize="characters" autocomplete="off">
      </div>
      <div class="field">
        <label>آخر 4 أرقام من رقم تليفون ولي الأمر</label>
        <input id="phoneInput" type="tel" placeholder="1234" maxlength="4" inputmode="numeric" autocomplete="off">
      </div>
      <p class="hint">نفس الكود والرقم بتوع صفحة متابعة ولي الأمر.</p>
      <button class="btn" id="go">دخول الامتحان</button>`;
    document.getElementById('go').onclick = handleIdentity;
    document.getElementById('phoneInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleIdentity(); });
  }

  async function handleIdentity(){
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    const phone = document.getElementById('phoneInput').value.trim();
    if (!code) { renderForm('أدخل كود الطالب'); return; }
    if (!/^\d{4}$/.test(phone)) { renderForm('أدخل آخر 4 أرقام صحيحة'); return; }
    card.innerHTML = '<div class="spinner"></div>';
    try {
      if (!auth.currentUser) await signInAnonymously(auth);
      const snap = await getDoc(doc(db, 'parent_portal', slug, 'students', `${code}_${phone}`));
      if (!snap.exists()) { renderForm('الكود أو الأرقام غير صحيحة'); return; }
      ctx = { code, last4: phone, groupName: snap.data().groupName || '' };
      window.__studentName = snap.data().name || '';
      await listExams();
    } catch (e) {
      renderForm('حصل خطأ — حاول تاني');
    }
  }

  // مهلة دخول ±دقيقتين لامتصاص انحراف بسيط في ساعة جهاز الطالب — المؤقّت
  // نفسه مربوط بوقت الخادم (startedAt) فالموعد النهائي الحقيقي محمي.
  const ENTRY_SKEW_MS = 2 * 60 * 1000;
  function examWindowState(ex){
    const now = Date.now();
    const opens = ex.opensAt ? new Date(ex.opensAt).getTime() : null;
    const closes = ex.closesAt ? new Date(ex.closesAt).getTime() : null;
    if (ex.status === 'stopped') return 'closed';
    if (opens && now < opens - ENTRY_SKEW_MS) return 'early';
    if (closes && now >= closes) return 'closed';
    return 'open';
  }

  async function listExams(){
    card.innerHTML = '<div class="spinner"></div>';
    let docs;
    try {
      const snap = await getDocs(collection(db, 'online_exams', slug, 'exams'));
      docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { renderForm('حصل خطأ في تحميل الامتحانات'); return; }

    const mine = docs.filter(ex =>
      (ex.status === 'published' || ex.status === 'stopped') &&
      ex.allowedCodes && ex.allowedCodes[ctx.code] === true);

    if (mine.length === 0) { stateScreen('🔒','غير متاح','مفيش امتحان متاح لمجموعتك حاليًا.','stop'); return; }

    const openable = mine.filter(ex => examWindowState(ex) === 'open');
    const early = mine.filter(ex => examWindowState(ex) === 'early');

    if (openable.length === 0 && early.length > 0) {
      const ex = early[0];
      stateScreen('⏳','الامتحان لسه ما بدأش', `يبدأ الساعة ${fmtClock(ex.opensAt)}.`,'wait');
      return;
    }
    if (openable.length === 0) { stateScreen('⏰','انتهى وقت الامتحان','مواعيد الامتحانات المتاحة لك انتهت.','stop'); return; }
    if (openable.length === 1) { openExam(openable[0]); return; }

    card.innerHTML = `<p class="pick-h">اختر الامتحان</p>` +
      openable.map((ex,i) => `<button class="exam-pick" data-i="${i}">
          <span class="pi">📝</span>
          <span><b>${escapeHtml(ex.title || 'امتحان')}</b>
          <small>${ex.questionCount || 0} سؤال · ${ex.durationMinutes || 0} دقيقة</small></span>
        </button>`).join('');
    card.querySelectorAll('.exam-pick').forEach(b => b.onclick = () => openExam(openable[+b.dataset.i]));
  }

  const attemptKey = () => `${ctx.code}_${ctx.last4}`;
  const lsKey = (examId) => `exam_${slug}_${examId}_${ctx.code}`;

  function fmtGrade(n){ const v = Number(n); return Number.isInteger(v) ? String(v) : v.toFixed(1); }

  async function openExam(ex){
    card.innerHTML = '<div class="spinner"></div>';
    const examRef = doc(db, 'online_exams', slug, 'exams', ex.id);
    try {
      const subSnap = await getDoc(doc(examRef, 'submissions', attemptKey()));
      if (subSnap.exists()) { await showResult(ex); return; }

      // محاولة موجودة؟ → استئناف (المؤقّت اشتغل قبل كده). غير كده → شاشة تعريف.
      const attRef = doc(examRef, 'attempts', attemptKey());
      const attSnap = await getDoc(attRef);
      if (attSnap.exists()) {
        const ts = attSnap.data().startedAt;
        const startedAtMs = ts && ts.toMillis ? ts.toMillis() : Date.now();
        showBriefing(ex, examRef, { resume: true, startedAtMs });
      } else {
        showBriefing(ex, examRef, { resume: false });
      }
    } catch (e) {
      stateScreen('⚠️','حصل خطأ','تأكد من اتصالك بالإنترنت وافتح الرابط تاني.','err');
    }
  }

  // ── نتيجة الطالب بعد اعتماد المعلم ─────────────────────────────
  async function showResult(ex){
    card.innerHTML = '<div class="spinner"></div>';
    let hist = [];
    try {
      const s = await getDoc(doc(db, 'parent_portal', slug, 'students', attemptKey()));
      if (s.exists() && Array.isArray(s.data().examHistory)) hist = s.data().examHistory;
    } catch (e) {}
    const rec = hist.find(h => String(h.examId) === String(ex.id));
    if (rec && rec.absent === true) {
      stateScreen('📋','مُسجّل غياب','المعلم سجّلك غائب عن هذا الامتحان.','stop');
      return;
    }
    if (rec && typeof rec.grade === 'number') {
      const g = rec.grade, m = Number(rec.maxGrade) || Number(ex.totalPoints) || 0;
      const pct = m > 0 ? Math.round(g / m * 100) : 0;
      card.innerHTML = `
        <div class="state ok">
          <div class="ring">🎯</div>
          <p class="t">درجتك: ${fmtGrade(g)} <span style="color:#94A3B8;font-weight:700;">من ${fmtGrade(m)}</span></p>
          <div class="grade-bar"><i style="width:${Math.max(4,pct)}%"></i></div>
          <p class="s">${pct}% — اعتمدها المعلم.</p>
        </div>`;
      return;
    }
    stateScreen('✅','تم تسليم إجاباتك','المعلم بيراجع النتيجة، وهتظهر هنا أول ما يعتمدها.','ok');
  }

  // ── شاشة تعريف الامتحان (اسم + مدة + عدد أسئلة + زر ابدأ) ───────
  function showBriefing(ex, examRef, opt){
    const qCount = Array.isArray(ex.questions) ? ex.questions.length : (ex.questionCount || 0);
    let hint;
    if (opt.resume){
      const durMs = (ex.durationMinutes || 0) * 60000;
      const closesMs = ex.closesAt ? new Date(ex.closesAt).getTime() : Infinity;
      const left = Math.min(opt.startedAtMs + durMs, closesMs) - Date.now();
      hint = `إنت بدأت الامتحان قبل كده — الوقت المتبقّي <b>${left > 0 ? fmtTime(left) : '00:00'}</b>`;
    } else {
      hint = 'أول ما تضغط "ابدأ" المؤقّت يشتغل ومينفعش يتوقف. جاوب كل الأسئلة وسلّم قبل انتهاء الوقت.';
    }
    card.innerHTML = `
      <div class="brief">
        <div class="brief-ico">📝</div>
        <h2 class="brief-title">${escapeHtml(ex.title || 'امتحان')}</h2>
        <div class="brief-meta">
          <span>❓ ${qCount} سؤال</span>
          <span>🎯 ${ex.totalPoints || 0} درجة</span>
          <span>⏱️ ${ex.durationMinutes || 0} دقيقة</span>
        </div>
        <p class="brief-hint">${hint}</p>
        <button class="btn" id="startBtn">${opt.resume ? 'إكمال الامتحان' : 'ابدأ الامتحان'}</button>
      </div>`;
    document.getElementById('startBtn').onclick = () => beginExam(ex, examRef, opt);
  }

  async function beginExam(ex, examRef, opt){
    card.innerHTML = '<div class="spinner"></div>';
    const attRef = doc(examRef, 'attempts', attemptKey());
    try {
      let startedAtMs, serverOffset = 0;
      if (opt.resume) {
        startedAtMs = opt.startedAtMs;
      } else {
        try {
          await setDoc(attRef, { code: ctx.code, startedAt: serverTimestamp() });
        } catch (e) { /* سباق جهازين — نكمّل بالقراءة الموجودة */ }
        const readAt = Date.now();
        let attSnap = null;
        try { attSnap = await getDocFromServer(attRef); } catch (e) {}
        const ts = attSnap && attSnap.exists() ? attSnap.data().startedAt : null;
        startedAtMs = ts && ts.toMillis ? ts.toMillis() : Date.now();
        if (ts && ts.toMillis) serverOffset = startedAtMs - readAt;
      }
      const durMs = (ex.durationMinutes || 0) * 60000;
      const closesMs = ex.closesAt ? new Date(ex.closesAt).getTime() : Infinity;
      const deadline = Math.min(startedAtMs + durMs, closesMs);
      runExam(ex, examRef, deadline, serverOffset);
    } catch (e) {
      stateScreen('⚠️','حصل خطأ','تأكد من اتصالك بالإنترنت وافتح الرابط تاني.','err');
    }
  }

  function runExam(ex, examRef, deadline, serverOffset){
    const now = () => Date.now() + (serverOffset || 0);
    const questions = Array.isArray(ex.questions) ? ex.questions : [];
    const rnd = mulberry32(seedFromString(ctx.code + ':' + ex.id));
    const qOrder = shuffled(questions, rnd);            // [{v:question, i:origIndex}]
    // ترتيب اختيارات مخلوط لكل سؤال + خريطة shuffledPos → originalPos
    const optMaps = qOrder.map(q => shuffled(q.v.options || [], rnd));

    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(lsKey(ex.id)) || '{}') || {}; } catch (e) { saved = {}; }
    const answers = saved;   // { questionId(str): originalOptionIndex }

    let done = false;

    function persist(){ try { localStorage.setItem(lsKey(ex.id), JSON.stringify(answers)); } catch (e){} }
    const answeredCount = () => qOrder.filter(q => answers[q.v.id] !== undefined).length;

    function updateProgress(){
      const n = answeredCount(), t = qOrder.length;
      const fill = document.getElementById('progFill');
      const txt = document.getElementById('progTxt');
      const badge = document.getElementById('subBadge');
      if (fill) fill.style.width = (t ? (n/t*100) : 0) + '%';
      if (txt) txt.textContent = `أجبت ${n} من ${t}`;
      if (badge) badge.textContent = `${n}/${t}`;
    }

    function render(){
      card.innerHTML = `
        <div class="xbar">
          <div class="xbar-row">
            <span class="xbar-title">${escapeHtml(ex.title || 'امتحان')}</span>
            <span class="timer" id="timer">⏱️ <span>--:--</span></span>
          </div>
          <div class="prog-wrap">
            <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0"></div></div>
            <div class="prog-txt" id="progTxt">أجبت 0 من ${qOrder.length}</div>
          </div>
        </div>
        <div class="qlist" id="qs"></div>
        <div class="sticky-sub">
          <button class="btn sub" id="submitBtn">تسليم الامتحان <span class="badge" id="subBadge">0/${qOrder.length}</span></button>
          <div id="retryNote"></div>
        </div>`;
      const qsEl = document.getElementById('qs');
      qOrder.forEach((q, qi) => {
        const qid = q.v.id;
        const wrap = document.createElement('div');
        wrap.className = 'q' + (answers[qid] !== undefined ? ' answered' : '');
        wrap.innerHTML = `<div class="q-head"><span class="q-num">${qi+1}</span><span class="q-text">${escapeHtml(q.v.text || '')}</span></div>`;
        optMaps[qi].forEach(op => {
          const row = document.createElement('label');
          row.className = 'opt' + (answers[qid] === op.i ? ' sel' : '');
          row.innerHTML = `<input type="radio" name="q${qi}" ${answers[qid] === op.i ? 'checked' : ''}><span class="mark"></span><span>${escapeHtml(op.v)}</span>`;
          row.querySelector('input').onchange = () => {
            answers[qid] = op.i;
            persist();
            wrap.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
            row.classList.add('sel');
            wrap.classList.add('answered');
            updateProgress();
          };
          wrap.appendChild(row);
        });
        qsEl.appendChild(wrap);
      });
      updateProgress();
      document.getElementById('submitBtn').onclick = () => {
        const left = qOrder.length - answeredCount();
        if (left > 0 && !confirm(`لسه في ${left} سؤال ما جاوبتش. متأكد إنك عايز تسلّم؟`)) return;
        submit(false);
      };
    }

    function tick(){
      if (done) return;
      const left = deadline - now();
      const el = document.getElementById('timer');
      if (el){
        el.querySelector('span').textContent = fmtTime(left);
        el.classList.toggle('low', left < 60000);
      }
      if (left <= 0){ submit(true); return; }
      setTimeout(tick, 500);
    }

    let inFlight = false;      // طلب setDoc جارٍ الآن
    let wantsSubmit = false;   // اتطلب تسليم (زر/مؤقّت) ولسه ما نجحش
    let wantsAuto = false;
    let retryTimer = null;

    async function submit(auto){
      if (done) return;
      wantsSubmit = true;
      wantsAuto = wantsAuto || !!auto;
      if (inFlight) return;
      inFlight = true;

      const btn = document.getElementById('submitBtn');
      if (btn){ btn.disabled = true; btn.textContent = 'جاري الإرسال...'; }
      const payload = {
        code: ctx.code,
        answers: { ...answers },
        submittedAt: serverTimestamp(),
        autoSubmitted: wantsAuto,
        startedAtClient: new Date().toISOString(),
      };
      try {
        await setDoc(doc(examRef, 'submissions', attemptKey()), payload);
        done = true;
        clearTimeout(retryTimer);
        try { localStorage.removeItem(lsKey(ex.id)); } catch (e){}
        stateScreen(wantsAuto ? '⏰' : '🎉',
          wantsAuto ? 'انتهى الوقت — تم إرسال إجاباتك' : 'تم إرسال إجاباتك بنجاح',
          'المعلم هيراجع إجاباتك ويعتمد النتيجة.', wantsAuto ? 'wait' : 'ok');
      } catch (e) {
        inFlight = false;
        const code = (e && e.code) || '';
        if (code === 'permission-denied'){
          // المستند موجود بالفعل = اتسلّم قبل كده (تسليم واحد مضمون بالقاعدة).
          done = true;
          clearTimeout(retryTimer);
          stateScreen('✅','لقد سلّمت هذا الامتحان بالفعل','تم استلام إجاباتك من قبل.','ok');
          return;
        }
        if (btn){ btn.disabled = false; btn.innerHTML = 'تسليم الامتحان <span class="badge" id="subBadge">' + answeredCount() + '/' + qOrder.length + '</span>'; }
        const note = document.getElementById('retryNote');
        if (note) note.innerHTML = `<div class="retry-note">لم يُرسَل بعد — لا تغلق الصفحة. جاري إعادة المحاولة تلقائيًا...</div>`;
        clearTimeout(retryTimer);
        retryTimer = setTimeout(() => submit(wantsAuto), 5000);
      }
    }
    // رجوع النت → حاول فورًا بدل انتظار دورة الـ5 ثوانٍ.
    window.addEventListener('online', () => {
      if (!done && wantsSubmit && !inFlight){ clearTimeout(retryTimer); submit(wantsAuto); }
    });

    render();
    tick();
  }

  async function init(){
    if (!slug) { stateScreen('🔗','الرابط غير متاح','تأكد إنك فتحت الرابط الصحيح من المعلم.','err'); return; }
    try {
      if (!auth.currentUser) await signInAnonymously(auth);
      const pSnap = await getDoc(doc(db, 'parent_portal', slug));
      if (pSnap.exists()){
        const p = pSnap.data();
        if (p.active === false ||
            (p.parentPortalExpiresAt && new Date(p.parentPortalExpiresAt) < new Date())){
          stateScreen('⏸️','الخدمة دي غير متاحة حاليًا','تواصل مع المعلم.','stop');
          return;
        }
        const title = p.teacherGender === 'female' ? 'مس' : 'مستر';
        if (p.teacherName){
          window.__teacherName = `${title} ${p.teacherName}`;
          document.getElementById('pageTitle').textContent = `امتحان — ${window.__teacherName}`;
        }
      }
      const oSnap = await getDoc(doc(db, 'online_exams', slug));
      if (oSnap.exists() && oSnap.data().active === false){
        stateScreen('⏸️','الخدمة دي غير متاحة حاليًا','تواصل مع المعلم.','stop');
        return;
      }
    } catch (e) {}
    renderForm();
  }

  init();
</script>
