<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1E1B4B" />
<title id="pageTitle">لعبة</title>
<link rel="icon" href="data:," />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1B1747; --night-2:#2E1F7A; --violet:#6D28D9;
    --chalk:#FFD15C; --on-chalk:#2A2200;
    --ink:#14172B; --muted:#5B6280; --line:#E4E6F2; --card:#FFFFFF;
    --ok:#10B981; --ok-d:#059669; --bad:#F43F5E; --amber:#F59E0B;
    --a1:#F43F5E; --a1d:#BE123C;
    --a2:#3B82F6; --a2d:#1D4ED8;
    --a3:#F59E0B; --a3d:#B45309;
    --a4:#10B981; --a4d:#047857;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    font-family:'Cairo',sans-serif;color:#fff;min-height:100dvh;
    background:
      radial-gradient(60% 40% at 90% 0%,rgba(244,114,182,.35),transparent 70%),
      radial-gradient(70% 45% at 0% 100%,rgba(45,212,191,.22),transparent 70%),
      linear-gradient(165deg,var(--night) 0%,var(--night-2) 55%,var(--violet) 130%);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;
    padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:520px;flex:1;display:flex;flex-direction:column;}
  .view{animation:in .35s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes in{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}

  /* ── شاشة الدخول/البداية ───────────────── */
  .emblem{width:104px;height:104px;margin:18px auto 14px;border-radius:32px;
    background:linear-gradient(145deg,#FFE08A,var(--chalk) 55%,#F5B52E);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55);
    transform:rotate(-6deg);}
  .emblem svg{width:60px;height:60px;}
  .h-title{font-size:25px;font-weight:900;margin:6px 0 4px;text-align:center;line-height:1.4;}
  .h-sub{font-size:13.5px;font-weight:600;margin:0 0 18px;text-align:center;color:rgba(255,255,255,.72);}
  .sheet{background:var(--card);color:var(--ink);border-radius:26px;padding:22px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:800;margin-bottom:7px;}
  .field input{width:100%;padding:15px 14px;border-radius:16px;border:2px solid var(--line);
    font-family:'Cairo';font-size:18px;font-weight:800;background:#F6F7FC;color:var(--ink);
    text-align:center;letter-spacing:2px;}
  .field input:focus{outline:none;border-color:var(--violet);background:#fff;box-shadow:0 0 0 4px rgba(109,40,217,.15);}
  .hint{font-size:12px;color:var(--muted);margin:-4px 2px 16px;line-height:1.7;font-weight:600;}
  .btn{display:block;width:100%;padding:17px;border:none;border-radius:18px;cursor:pointer;
    font-family:'Cairo';font-weight:900;font-size:17px;color:var(--on-chalk);
    background:linear-gradient(180deg,#FFE08A,var(--chalk));
    box-shadow:0 6px 0 #C9962A,0 14px 24px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #C9962A,0 6px 12px rgba(0,0,0,.25);}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:0 6px 0 #9a7a30;}
  .btn.violet{color:#fff;background:linear-gradient(180deg,#8B5CF6,var(--violet));
    box-shadow:0 6px 0 #4C1D95,0 14px 24px rgba(0,0,0,.25);}
  .btn.violet:active{box-shadow:0 2px 0 #4C1D95,0 6px 12px rgba(0,0,0,.25);}
  .btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;margin-top:12px;
    border:1.5px solid rgba(255,255,255,.28);}
  .err{background:#FFF1F2;border:1px solid #FECDD3;color:#BE123C;padding:11px 12px;border-radius:14px;
    font-size:12.5px;margin-bottom:14px;text-align:center;font-weight:700;}
  .chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 18px;}
  .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);padding:7px 14px;
    border-radius:999px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;}
  .best{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 18px;
    color:var(--chalk);font-weight:900;font-size:15px;}
  .state{text-align:center;padding:26px 8px;}
  .state .big{font-size:56px;margin-bottom:10px;}
  .state .t{font-weight:900;font-size:19px;margin:0 0 6px;}
  .state .s{font-size:13.5px;margin:0;line-height:1.9;font-weight:600;color:rgba(255,255,255,.75);}
  .spinner{width:34px;height:34px;border:4px solid rgba(255,255,255,.25);border-top-color:var(--chalk);
    border-radius:50%;animation:spin .7s linear infinite;margin:60px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── HUD ───────────────────────────────── */
  /* مساحة محجوزة على الشمال لزرار الصوت (ثابت فوق) عشان ما يغطّيش النقاط */
  .hud{display:flex;align-items:center;gap:12px;margin:2px 0 14px;padding-inline-end:50px;}
  .ring{position:relative;width:56px;height:56px;flex-shrink:0;}
  .ring svg{width:56px;height:56px;transform:rotate(-90deg);}
  .ring .bg{stroke:rgba(255,255,255,.18);} .ring .fg{stroke:var(--chalk);transition:stroke .2s;}
  .ring.low .fg{stroke:var(--bad);}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;}
  .ring.low b{color:#FFB4C0;animation:beat .5s infinite alternate;}
  @keyframes beat{to{transform:scale(1.18);}}
  .prog{flex:1;min-width:0;}
  .dots{display:flex;gap:4px;margin-bottom:6px;}
  .dots i{flex:1;height:7px;border-radius:7px;background:rgba(255,255,255,.2);}
  .dots i.done{background:var(--chalk);} .dots i.now{background:#fff;}
  .prog small{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);}
  .scorebox{position:relative;text-align:center;min-width:76px;}
  .scorebox b{display:block;font-size:24px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--chalk);}
  .scorebox small{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);}
  .streak{position:absolute;top:-8px;left:-6px;background:#FB923C;color:#fff;border-radius:999px;
    padding:1px 8px;font-size:11.5px;font-weight:900;animation:pop .3s;}
  @keyframes pop{from{transform:scale(0);}60%{transform:scale(1.25);}to{transform:scale(1);}}
  .float{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-weight:900;font-size:20px;
    color:#6EE7B7;pointer-events:none;animation:floatup 1s ease-out forwards;white-space:nowrap;}
  @keyframes floatup{to{transform:translate(-50%,-34px);opacity:0;}}

  /* ── السؤال ────────────────────────────── */
  .qcard{background:var(--card);color:var(--ink);border-radius:26px;padding:20px 18px;margin-bottom:14px;
    box-shadow:0 18px 40px rgba(0,0,0,.28);}
  .qcard .q{font-size:19px;font-weight:800;line-height:1.85;margin:0;white-space:pre-wrap;text-align:center;}
  .qcard img.qi{display:block;max-width:100%;max-height:240px;object-fit:contain;border-radius:16px;margin:0 auto 14px;cursor:zoom-in;}
  .qcard img.qi + .q, .qcard .q + img.qi{margin-top:12px;}
  .answers{display:grid;grid-template-columns:1fr;gap:12px;}
  .answers.two{grid-template-columns:1fr 1fr;}
  .tile{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:right;color:#fff;
    border:none;border-radius:20px;padding:16px 14px;cursor:pointer;font-family:'Cairo';font-weight:800;
    font-size:16px;line-height:1.6;min-height:64px;
    background:linear-gradient(160deg,var(--c),var(--cd));box-shadow:0 5px 0 var(--cd),0 12px 20px rgba(0,0,0,.22);
    transition:transform .08s,box-shadow .08s,opacity .2s,filter .2s;}
  .tile:nth-child(4n+1){--c:var(--a1);--cd:var(--a1d);} .tile:nth-child(4n+2){--c:var(--a2);--cd:var(--a2d);}
  .tile:nth-child(4n+3){--c:var(--a3);--cd:var(--a3d);} .tile:nth-child(4n+4){--c:var(--a4);--cd:var(--a4d);}
  .tile:active:not(.locked){transform:translateY(4px);box-shadow:0 1px 0 var(--cd),0 4px 8px rgba(0,0,0,.2);}
  .tile .shape{width:34px;height:34px;flex-shrink:0;border-radius:11px;background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;}
  .tile .shape svg{width:18px;height:18px;fill:#fff;}
  .tile .tx{flex:1;}
  .tile img{max-height:64px;border-radius:10px;}
  /* اختيارات بصور: شبكة 2×2 وصور أكبر */
  .answers.imgs{grid-template-columns:1fr 1fr;}
  .answers.imgs .tile{flex-direction:column;align-items:stretch;text-align:center;padding:12px 10px;}
  .answers.imgs .tile .shape{align-self:flex-start;width:28px;height:28px;border-radius:9px;}
  .answers.imgs .tile img{width:100%;max-height:130px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;order:-1;}
  .tile.locked img,.tile.correct img,.tile.wrong img{cursor:zoom-in;}
  .zm{position:fixed;inset:0;z-index:1000;background:rgba(8,8,24,.94);touch-action:none;overflow:hidden;
    -webkit-user-select:none;user-select:none;}
  .zm img{position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;transform:translate(-50%,-50%);
    will-change:transform;pointer-events:none;-webkit-user-drag:none;}
  .zm-x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;
    border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer;}
  .zm-hint{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.16);color:#fff;font:700 12px 'Cairo',sans-serif;padding:7px 14px;
    border-radius:999px;transition:opacity .4s;white-space:nowrap;pointer-events:none;}
  .zm-hint.off{opacity:0;}
  .prep{text-align:center;padding:90px 0;font-weight:800;color:rgba(255,255,255,.8);}
  .prep .spinner{margin:0 auto 16px;}
  .tile.locked{cursor:default;filter:saturate(.35) brightness(.8);opacity:.6;}
  .tile.correct{filter:none;opacity:1;--c:#34D399;--cd:#047857;animation:glow .7s ease-out;}
  .tile.wrong{filter:none;opacity:1;--c:#FB7185;--cd:#9F1239;animation:shake .45s;}
  .tile.correct::after,.tile.wrong::after{position:absolute;top:-9px;left:-7px;width:30px;height:30px;
    border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.3);}
  .tile.correct::after{content:'✓';color:#059669;} .tile.wrong::after{content:'✕';color:#E11D48;}
  @keyframes glow{0%{transform:scale(1);}40%{transform:scale(1.04);}100%{transform:scale(1);}}
  @keyframes shake{20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
  /* صح/غلط: بلاطتين ضخمة */
  .tf .tile{flex-direction:column;justify-content:center;text-align:center;gap:8px;min-height:150px;
    font-size:24px;border-radius:26px;}
  .tf .tile .shape{width:58px;height:58px;border-radius:20px;}
  .tf .tile .shape svg{width:32px;height:32px;}
  .tf .tile:nth-child(1){--c:#34D399;--cd:#047857;} .tf .tile:nth-child(2){--c:#FB7185;--cd:#9F1239;}

  /* ── الرد بعد الإجابة ───────────────────── */
  .fb{margin-top:14px;border-radius:22px;padding:14px 16px;animation:in .3s both;color:var(--ink);background:#fff;}
  .fb .row{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;}
  .fb.good .row{color:var(--ok-d);} .fb.bad .row{color:#BE123C;} .fb.late .row{color:#B45309;}
  .fb .pts{margin-right:auto;background:#ECFDF5;color:var(--ok-d);padding:3px 12px;border-radius:999px;font-size:15px;}
  .fb .note{margin:10px 0 0;font-size:13.5px;line-height:1.85;font-weight:600;color:#3D4260;}
  .fb .note img{display:block;max-width:100%;max-height:180px;object-fit:contain;border-radius:12px;margin-top:8px;cursor:zoom-in;}
  .fb .btn{margin-top:14px;}

  /* ── النتيجة ───────────────────────────── */
  .trophy{display:block;width:130px;height:130px;margin:6px auto 0;animation:pop .6s both;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35));}
  .stars{display:flex;justify-content:center;gap:6px;margin:6px 0 2px;}
  .stars svg{width:44px;height:44px;}
  .stars svg:nth-child(2){transform:translateY(-8px) scale(1.15);}
  .stars svg .f{fill:rgba(255,255,255,.18);} .stars svg.on .f{fill:var(--chalk);}
  .stars svg.on{animation:pop .5s both;}
  .stars svg.on:nth-child(2){animation-delay:.15s;} .stars svg.on:nth-child(3){animation-delay:.3s;}
  .final{font-size:64px;font-weight:900;line-height:1.1;margin:8px 0 0;text-align:center;color:var(--chalk);
    font-variant-numeric:tabular-nums;text-shadow:0 6px 24px rgba(0,0,0,.35);}
  .final-l{text-align:center;font-weight:700;color:rgba(255,255,255,.75);margin:0 0 14px;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 16px;}
  .stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:18px;
    padding:12px;text-align:center;}
  .stat b{display:block;font-size:22px;font-weight:900;} .stat small{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);}
  .newbest{text-align:center;margin:0 0 14px;color:#1A1300;background:linear-gradient(90deg,#FFE08A,var(--chalk));
    border-radius:999px;padding:8px 16px;font-weight:900;font-size:14px;animation:pop .5s .5s both;}
  .note-line{text-align:center;font-size:13px;font-weight:700;color:rgba(255,255,255,.75);margin:0 0 14px;}
  .snd{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;z-index:60;width:42px;height:42px;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:rgba(20,16,70,.55);color:#fff;
    backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .snd svg{width:22px;height:22px;fill:#fff;}
  .snd:active{transform:scale(.92);}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;}
  }
  @media (max-width:360px){ .qcard .q{font-size:17px;} .tile{font-size:15px;} .final{font-size:54px;} }
</style>
</head>
<body>
<button class="snd" id="snd" aria-label="الصوت" aria-pressed="true"></button>
<canvas id="fx"></canvas>
<div class="wrap" id="app"><div class="spinner"></div></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInAnonymously }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqFLZ4kHEgPLVgLgDGbbIjxnZheBqMjMc",
    authDomain: "active-class-72e0f.firebaseapp.com",
    projectId: "active-class-72e0f",
    storageBucket: "active-class-72e0f.firebasestorage.app",
    messagingSenderId: "822461821604",
    appId: "1:822461821604:web:3bd266a9833ce045916c31",
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const appEl = document.getElementById('app');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // الرابط: /game/?s=<slug>&g=<gameId> (أو /game/<slug>/<gameId>).
  function parseIds(){
    const q = new URLSearchParams(location.search);
    let s = q.get('s'), g = q.get('g');
    if (!s || !g) {
      const parts = location.pathname.split('/').filter(Boolean);
      const i = parts.indexOf('game');
      if (i !== -1) { s = s || parts[i+1]; g = g || parts[i+2]; }
    }
    return { slug: s || '', gameId: g || '' };
  }
  const { slug, gameId } = parseIds();

  const esc = (str) => { const d = document.createElement('div'); d.innerText = str ?? ''; return d.innerHTML; };
  const imgTag = (url, cls) => url
    ? `<img class="${cls||''}" src="${esc(url)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
  // تحميل مسبق للصور: العدّاد بيبدأ بعد ما صور السؤال تتحمّل (أو بعد 5 ثواني
  // كحد أقصى) عشان النت الضعيف ماياكلش وقت الطالب.
  const imgSeen = new Set();
  function preload(urls){
    const ps = urls.filter(u => u && !imgSeen.has(u)).map(u => new Promise(res => {
      const im = new Image();
      im.onload = im.onerror = () => { imgSeen.add(u); res(); };
      im.src = u;
    }));
    if (!ps.length) return Promise.resolve();
    return Promise.race([Promise.all(ps), new Promise(r => setTimeout(r, 5000))]);
  }
  const urlsOf = (it) => [it.q.imageUrl, it.stmtImg, ...(it.q.optionImageUrls || [])];

  // ── عارض الصور بزوم ───────────────────────────────────────────
  // ضغطة على أي صورة تفتحها ملء الشاشة. جوّه العارض: قرص بصباعين للتكبير
  // (لحد 6×)، سحب بصباع واحد للتنقّل وهي مكبّرة، ضغطتين سريعتين تكبّر/تصغّر،
  // وضغطة واحدة تصغّرها لو مكبّرة وإلا تقفل العارض. على الكمبيوتر: عجلة الماوس.
  function openZoom(url){
    if (document.querySelector('.zm')) return;
    const MAX = 6, TAP_MS = 280;
    const root = document.createElement('div');
    root.className = 'zm';
    root.innerHTML = '<img alt=""><button class="zm-x" aria-label="إغلاق">✕</button><span class="zm-hint">اقرص بصباعين للتكبير</span>';
    document.body.appendChild(root);
    const img = root.querySelector('img');
    const hint = root.querySelector('.zm-hint');
    img.src = url;
    setTimeout(() => hint.classList.add('off'), 2600);

    let s = 1, tx = 0, ty = 0;
    const pts = new Map();
    let pinch = null, pan = null, downAt = 0, moved = 0, lastTap = 0, tapTimer = null, multi = false;

    const apply = () => { img.style.transform = `translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${s})`; };
    function clamp(){
      const vw = root.clientWidth, vh = root.clientHeight;
      const w = img.offsetWidth * s, h = img.offsetHeight * s;
      const mx = Math.max(0, (w - vw) / 2), my = Math.max(0, (h - vh) / 2);
      tx = Math.min(mx, Math.max(-mx, tx));
      ty = Math.min(my, Math.max(-my, ty));
    }
    // يكبّر/يصغّر حوالين نقطة (x,y) على الشاشة مع تثبيتها مكانها.
    function zoomAt(x, y, ns){
      ns = Math.min(MAX, Math.max(1, ns));
      const cx = root.clientWidth / 2, cy = root.clientHeight / 2;
      const k = ns / s;
      tx = (x - cx) - k * (x - cx - tx);
      ty = (y - cy) - k * (y - cy - ty);
      s = ns;
      if (s <= 1.001) { s = 1; tx = 0; ty = 0; }
      clamp(); apply();
    }
    const close = () => { clearTimeout(tapTimer); root.remove(); };
    root.querySelector('.zm-x').onclick = (e) => { e.stopPropagation(); close(); };

    root.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.zm-x')) return;
      try { root.setPointerCapture(e.pointerId); } catch (_) {}
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { downAt = performance.now(); moved = 0; multi = false; pan = { x: e.clientX, y: e.clientY, tx, ty }; }
      if (pts.size === 2) {
        multi = true; pan = null;
        const [a, b] = [...pts.values()];

      document.querySelectorAll('#opts .tile').forEach(b => {
        b.onclick = null; b.classList.add('locked');
        if (tf) {
          const v = b.dataset.v === '1';
          if (v === it.truth) b.classList.replace('locked','correct');
          else if (chosen !== null && v === (chosen === 1)) b.classList.replace('locked','wrong');
        } else {
          const oi = +b.dataset.i;
          if (oi === q.correctIndex) b.classList.replace('locked','correct');
          else if (oi === chosen) b.classList.replace('locked','wrong');
        }
      });

      const last = run.i + 1 >= run.items.length;
      const cls = ok ? 'good' : (chosen === null ? 'late' : 'bad');
      const title = ok ? (run.streak >= 3 ? 'ولا غلطة! 🔥' : 'برافو!') : (chosen === null ? 'الوقت خلص ⏰' : 'غلط للأسف');
      const correctNote = (!ok && tf && q.options.length > 2) ? `الإجابة الصحيحة: <b>${esc(it.correctText)}</b>` : '';
      const expl = (q.explanation || q.explanationImageUrl)
        ? `<p class="note">💡 ${esc(q.explanation || '')}${imgTag(q.explanationImageUrl)}</p>` : '';
      document.getElementById('after').innerHTML = `
        <div class="fb ${cls}"><div class="row"><span>${title}</span>${ok ? `<span class="pts">+${gained}</span>` : ''}</div>
          ${correctNote ? `<p class="note">${correctNote}</p>` : ''}${expl}
          <button class="btn violet" id="next">${last ? 'شوف نتيجتك 🏁' : 'السؤال اللي بعده'}</button></div>`;
      const nb = document.getElementById('next');
      nb.onclick = () => { run.i++; last ? showResult() : showQuestion(); };
      nb.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
    }

    document.querySelectorAll('#opts .tile').forEach(b => {
      b.onclick = () => finish(tf ? +b.dataset.v : +b.dataset.i);
    });

    let lastSec = Infinity;
    timer = setInterval(() => {
      const left = Math.max(0, limit - (performance.now() - startedAt));
      const sec = Math.ceil(left / 1000);
      if (sec <= 3 && sec > 0 && sec < lastSec) sfx.tick(sec === 1);
      lastSec = Math.min(lastSec, sec);
      rfg.style.strokeDashoffset = String(CIRC * (1 - left / limit));
      rn.textContent = Math.ceil(left / 1000);
      ring.classList.toggle('low', left / limit < 0.3);
      if (left <= 0) finish(null);
    }, 100);
  }

  async function showResult(){
    clearTimer();
    const total = run.items.length;
    const pct = total ? run.correct / total : 0;
    const starsOn = pct >= 0.85 ? 3 : pct >= 0.6 ? 2 : pct > 0 ? 1 : 0;
    const prevBest = best ? best.score : -1;
    const isNewBest = run.score > prevBest;
    const closed = game.status === 'closed';
    appEl.innerHTML = '<div class="spinner"></div>';
    let saved = true;
    if (isNewBest && !closed) {
      try {
        await setDoc(doc(db, 'online_exams', slug, 'games', gameId, 'scores', `${ctx.code}_${ctx.last4}`), {
          code: ctx.code, name: ctx.name, score: run.score, correct: run.correct,
          total, timeMs: run.timeMs, updatedAt: serverTimestamp(),
        });
        best = { score: run.score };
      } catch (e) { saved = false; }
    }
    const heading = starsOn === 3 ? 'أسطورة! 🎉' : starsOn === 2 ? 'شغل جامد 👏' : starsOn === 1 ? 'بداية حلوة — جرّب تاني 💪' : 'محتاجة مذاكرة — جرّب تاني';
    view(`
      ${starsOn >= 2 ? ICON.trophy : `<div class="emblem" style="margin-top:6px">${ICON.rocket}</div>`}
      <p class="h-title" style="margin-bottom:0">${heading}</p>
      <div class="stars">${[1,2,3].map(n => ICON.star.replace('<svg', `<svg class="${n <= starsOn ? 'on' : ''}"`)).join('')}</div>
      <p class="final" id="fin">0</p><p class="final-l">نقطة</p>
      ${isNewBest && saved && !closed ? '<div class="newbest">🏆 أفضل نتيجة ليك لحد دلوقتي!</div>' : ''}
      ${!isNewBest ? `<p class="note-line">أفضل نتيجة ليك: ${prevBest} نقطة</p>` : ''}
      ${!saved ? '<div class="sheet" style="padding:12px;margin-bottom:14px"><div class="err" style="margin:0">ماقدرناش نسجّل نتيجتك — اتأكد من النت وجرّب تاني.</div></div>' : ''}
      ${closed ? '<p class="note-line">اللعبة مقفولة — النتيجة دي ماتسجّلتش.</p>' : ''}
      <div class="stats">
        <div class="stat"><b>${run.correct}/${total}</b><small>إجابات صح</small></div>
        <div class="stat"><b>${(run.timeMs/1000).toFixed(0)} ث</b><small>وقت الإجابات</small></div>
      </div>
      <button class="btn" id="again">${closed ? 'رجوع' : 'العب تاني'}</button>`);
    countUp(document.getElementById('fin'), run.score);
    if (starsOn === 0) sfx.lose(); else { sfx.win(starsOn); if (isNewBest && saved && !closed) sfx.best(); }
    if (starsOn >= 2 && (isNewBest || starsOn === 3)) confetti();
    document.getElementById('again').onclick = () => { closed ? showBriefing() : startGame(); };
  }

  if (!slug || !gameId) message('🔒','الرابط ناقص','اطلب من المدرس يبعتلك الرابط تاني.');
  else renderForm();
</script>
</body>
</html>
