<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#1B2150" />
<title id="pageTitle">متابعة الطالب</title>
<link id="favicon" rel="icon" href="data:," />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* هوية "السبورة والطباشير": هيدر نيلي داكن + زر طباشيري أصفر + ألواح مسطّحة.
     الألوان معرّفة كتوكنز، والوضع الداكن بيتبع النظام. */
  :root{
    --board:#1B2150; --board-ink:#F4F5FF; --board-muted:#B9BEE6;
    --chalk:#FFD24A; --chalk-ink:#1B2150;
    --bg:#F3F4F9; --panel:#FFFFFF; --line:#E3E5EF; --tray:#F3F4F9;
    --ink:#14172B; --muted:#5B6078;
    --ok:#0B7A55; --ok-soft:#E3F6EE;
    --warn:#8A5200; --warn-soft:#FFF1D6;
    --bad:#B42318; --bad-soft:#FDE8E6;
    --info:#3A3FB5; --info-soft:#E8E9FB;
    --focus:#3A3FB5; --tab-on:#1B2150;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --board:#151A40; --board-ink:#F4F5FF; --board-muted:#A3A8CC;
      --bg:#0D1024; --panel:#171B38; --line:#2A2F55; --tray:#10142D;
      --ink:#EEF0FF; --muted:#A3A8CC;
      --ok:#5FD6A4; --ok-soft:#123027;
      --warn:#FFC766; --warn-soft:#3A2E10;
      --bad:#FF9C93; --bad-soft:#3C1B1E;
      --info:#B2B6FF; --info-soft:#23275A;
      --focus:#FFD24A; --tab-on:#2E3580;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.6;
  }
  button,input{font-family:inherit;}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .wrap{width:100%;max-width:480px;margin:0 auto;}
  svg.i{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  svg.i.s{width:16px;height:16px;}

  /* ── الهيدر (السبورة) ── */
  .board{background:var(--board);color:var(--board-ink);padding:22px 16px 56px;}
  .board .wrap{display:flex;flex-direction:column;gap:14px;}
  .teacher{display:flex;align-items:center;gap:12px;}
  .t-avatar{
    position:relative;width:52px;height:52px;border-radius:50%;overflow:hidden;flex-shrink:0;
    background:var(--chalk);color:var(--chalk-ink);font-weight:800;font-size:22px;
    display:flex;align-items:center;justify-content:center;
  }
  .t-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .t-avatar img[hidden]{display:none;}
  .t-name{font-size:17px;font-weight:800;margin:0;line-height:1.4;}
  .t-spec{font-size:13px;color:var(--board-muted);margin:0;}
  .t-spec[hidden]{display:none;}
  .board h1{font-size:22px;font-weight:800;margin:0;line-height:1.4;}
  .board .lead{margin:0;font-size:14px;color:var(--board-muted);}
  .student-line{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .student-name{font-size:21px;font-weight:800;margin:0;line-height:1.4;overflow-wrap:anywhere;}
  .group-chip{
    display:inline-block;margin-top:4px;padding:2px 12px;border-radius:999px;
    border:1px solid var(--board-muted);color:var(--board-ink);font-size:13px;font-weight:600;
  }
  .switch-btn{
    display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;
    background:transparent;color:var(--board-ink);border:1px solid var(--board-muted);
    font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0;
  }

  .board.compact{padding:14px 16px 46px;}
  .board.compact .wrap{gap:10px;}
  .board.compact .t-avatar{width:38px;height:38px;font-size:17px;}
  .board.compact .t-name{font-size:15px;}
  .board.compact .t-spec{font-size:12px;}
  .board.compact .student-name{font-size:19px;line-height:1.35;}
  .board.compact .group-chip{margin-top:2px;font-size:12px;padding:1px 10px;}
  .board.compact .switch-btn{min-height:40px;padding:0 12px;font-size:13px;}

  /* ── اللوح ── */
  .main{margin-top:-32px;padding:0 14px 48px;}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
    animation:rise .25s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.panel{animation:none;} .spinner{animation-duration:2s;}}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;}
  .field .hint{font-size:13px;color:var(--muted);margin:4px 0 0;}
  .field input{
    width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-size:18px;background:var(--tray);color:var(--ink);text-align:center;letter-spacing:2px;
  }
  .field input::placeholder{color:var(--muted);opacity:.8;letter-spacing:1px;}
  .field input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent);}
  .btn{
    width:100%;min-height:50px;border-radius:12px;border:none;background:var(--chalk);color:var(--chalk-ink);
    font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{transform:scale(.99);}
  .err{
    display:flex;gap:8px;align-items:flex-start;background:var(--bad-soft);color:var(--bad);
    padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;margin-bottom:14px;
  }
  .state{text-align:center;padding:14px 4px;}
  .state svg.i{width:34px;height:34px;color:var(--muted);margin-bottom:6px;}
  .state p{margin:0 0 4px;font-weight:800;font-size:16px;}
  .state span{font-size:14px;color:var(--muted);}
  .spinner{
    width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--info);
    border-radius:50%;animation:spin .7s linear infinite;margin:26px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── التابات: شريط سفلي ثابت، كل الأقسام ظاهرة دايمًا بدون تمرير أفقي ── */
  .results{padding-bottom:84px;}
  .tabs-wrap{
    position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);
    border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tabs{
    display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:4px;
    max-width:480px;margin:0 auto;
  }
  .tab{
    min-height:56px;padding:4px 2px;border:none;border-radius:12px;background:transparent;
    color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;line-height:1.2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .tab svg.i{width:22px;height:22px;}
  .tab[aria-selected="true"]{background:var(--tab-on);color:var(--board-ink);}
  .tab-panel{padding-top:10px;display:flex;flex-direction:column;gap:12px;}
  .tab-panel[hidden]{display:none;}

  /* ── كتل ── */
  .trays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .trays.two{grid-template-columns:1fr 1fr;}
  .tray{background:var(--tray);border-radius:12px;padding:10px 6px;text-align:center;min-width:0;}
  .tray .n{font-size:24px;font-weight:800;line-height:1.3;}
  .tray .l{font-size:13px;color:var(--muted);font-weight:600;}
  .tray.ok .n{color:var(--ok);} .tray.warn .n{color:var(--warn);} .tray.bad .n{color:var(--bad);} .tray.info .n{color:var(--info);}
  .bar{height:8px;border-radius:99px;background:var(--tray);overflow:hidden;margin-top:12px;}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:99px;}
  .bar-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-top:6px;}
  .h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:0 0 10px;}
  .h svg{color:var(--muted);}
  .list{display:flex;flex-direction:column;}
  .row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;
    border-top:1px solid var(--line);font-size:15px;
  }
  .row:first-child{border-top:none;}
  .row .d{font-weight:700;}
  .row .sub{font-size:13px;color:var(--muted);}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
    font-size:13px;font-weight:800;white-space:nowrap;
  }
  .badge.ok{background:var(--ok-soft);color:var(--ok);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.bad{background:var(--bad-soft);color:var(--bad);}
  .badge.info{background:var(--info-soft);color:var(--info);}
  .amount{font-weight:800;color:var(--ok);white-space:nowrap;}
  .grade{font-weight:800;white-space:nowrap;direction:ltr;unicode-bidi:isolate;display:inline-block;}
  .tray .n{direction:ltr;unicode-bidi:isolate;}
  .grade small{font-weight:600;color:var(--muted);font-size:13px;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:14px 0;}
  .balance{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
  .balance .lbl{font-size:14px;color:var(--muted);font-weight:600;margin:0;}
  .balance .big{font-size:30px;font-weight:800;line-height:1.3;margin:0;}
  .balance .big small{font-size:15px;font-weight:700;color:var(--muted);}
  .exempt{margin-top:10px;font-size:13px;font-weight:700;color:var(--info);display:flex;align-items:center;gap:6px;}
  .perf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .perf-head b{font-size:15px;}
  .perf-pct{font-size:24px;font-weight:800;}
  .perf-meta{display:flex;justify-content:space-between;font-size:13px;margin:0 0 4px;color:var(--muted);font-weight:600;}
  .perf-meta .up{color:var(--ok);} .perf-meta .down{color:var(--bad);}
  .perf + .perf{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;}
  .foot{text-align:center;color:var(--muted);font-size:13px;padding:6px 0 0;}
</style>
</head>
<body>
<header class="board" id="board"><div class="wrap" id="boardInner"></div></header>
<main class="main"><div class="wrap" id="main"></div></main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqFLZ4kHEgPLVgLgDGbbIjxnZheBqMjMc",
    authDomain: "active-class-72e0f.firebaseapp.com",
    projectId: "active-class-72e0f",
    storageBucket: "active-class-72e0f.firebasestorage.app",
    messagingSenderId: "822461821604",
    appId: "1:822461821604:web:3bd266a9833ce045916c31",
  };
  const db = getFirestore(initializeApp(firebaseConfig));
  // نقطة القراءة الوحيدة من Firestore: ترجّع بيانات المستند أو null.
  const fetchDoc = (...path) => getDoc(doc(db, ...path)).then(s => s.exists() ? s.data() : null);

  const boardInner = document.getElementById('boardInner');
  const main = document.getElementById('main');

  // أيقونات SVG (نفس الأسلوب: خط 2px) بدل الإيموجي.
  const P = {
    cap:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
    calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/>',
    wallet:'<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16.5" cy="14" r="1.2"/>',
    book:'<path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/>',
    file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
    chart:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    x:'<path d="M18 6 6 18M6 6l12 12"/>',
    minus:'<path d="M5 12h14"/>',
    swap:'<path d="M17 3l4 4-4 4"/><path d="M3 7h18M7 21l-4-4 4-4"/><path d="M21 17H3"/>',
    link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
    pause:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
    alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
    mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',
    heart:'<path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/>',
    arrowUp:'<path d="M12 19V5M5 12l7-7 7 7"/>',
    arrowDown:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
  };
  const icon = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

  function getSlug() {
    const parts = window.location.pathname.split('/').filter(Boolean);
    const idx = parts.indexOf('track');
    if (idx !== -1 && parts[idx + 1]) return parts[idx + 1];
    return parts[parts.length - 1] || '';
  }
  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str ?? '';
    return d.innerHTML;
  }
  const fmtMoney = (n) => (Number(n) || 0).toLocaleString('ar-EG', { maximumFractionDigits: 0 });
  function fmtDate(iso){
    try {
      return new Date(iso).toLocaleDateString('ar-EG', { weekday: 'short', day: 'numeric', month: 'long' });
    } catch (e) { return iso; }
  }
  // ملاحظة الدفعة بيكتبها التطبيق بصيغة داخلية (months=2026-11,2026-12;custom=1;
  // note=...;siblings=2;sessions=4) — ولي الأمر يشوفها بالعربي مش خام.
  function payNoteLabel(note){
    const raw = (note || '').toString().trim();
    if (!raw) return '';
    if (!/(^|;)(months|custom|siblings|sessions|note)=/.test(raw)) return raw; // نص حر (مثلاً "إسقاط مديونية")
    const get = (k) => { const m = raw.match(new RegExp('(?:^|;)' + k + '=([^;]*)')); return m ? m[1].trim() : ''; };
    const parts = [];
    const months = get('months').split(',').map(x => x.trim()).filter(Boolean).map(k => {
      const m = k.match(/^(\d{4})-(\d{1,2})$/);
      if (!m) return '';
      try { return new Date(Number(m[1]), Number(m[2]) - 1, 1).toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' }); } catch (e) { return ''; }
    }).filter(Boolean);
    if (months.length === 1) parts.push('عن شهر ' + months[0]);
    else if (months.length > 1) parts.push('عن شهور: ' + months.join('، '));
    const sessions = Number(get('sessions'));
    if (sessions > 0) parts.push(fmtMoney(sessions) + (sessions === 1 ? ' حصة' : ' حصص'));
    if (Number(get('siblings')) >= 2) parts.push('دفعة مشتركة للإخوة');
    const txt = get('note');
    if (txt) parts.push(txt);
    return parts.join(' · ');
  }
  // أرقام عربية-هندية (٠-٩) وفارسية (۰-۹) → لاتينية، وشيل المسافات والرموز الخفية.
  const toLatinDigits = (v) => (v || '')
    .replace(/[\u0660-\u0669]/g, (c) => String(c.charCodeAt(0) - 0x0660))
    .replace(/[\u06F0-\u06F9]/g, (c) => String(c.charCodeAt(0) - 0x06F0))
    .replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069\s]/g, '');
  const fmtNum = (n) => Number.isInteger(Number(n)) ? String(Number(n)) : Number(n).toFixed(1);

  const slug = getSlug();
  let codeOnly = false;
  const teacher = { name:'', spec:'', photo:'', initial:'' };

  // ── الهيدر ──────────────────────────────────────────────
  function teacherBlock(){
    if (!teacher.name) return '';
    return `
      <div class="teacher">
        <div class="t-avatar"><span>${escapeHtml(teacher.initial || '')}</span><img id="tImg" alt="" hidden decoding="async"></div>
        <div>
          <p class="t-name">${escapeHtml(teacher.name)}</p>
          ${teacher.spec ? `<p class="t-spec">${escapeHtml(teacher.spec)}</p>` : ''}
        </div>
      </div>`;
  }
  function loadTeacherPhoto(){
    // نقبل بس صور مرفوعة على نطاقنا (دفاع إضافي)
    if (!/^https:\/\/active-class\.online\/photos\//.test(teacher.photo)) return;
    const img = document.getElementById('tImg');
    if (!img) return;
    img.onload = () => { img.hidden = false; };
    img.onerror = () => { img.hidden = true; };
    img.src = teacher.photo;
  }
  function setBoardLogin(){
    board.classList.remove('compact');
    boardInner.innerHTML = `
      ${teacherBlock()}
      <div>
        <h1>متابعة الطالب</h1>
        <p class="lead">اعرف حضور ابنك ومدفوعاته وواجباته وامتحاناته.</p>
      </div>`;
    loadTeacherPhoto();
  }
  function setBoardStudent(d){
    board.classList.add('compact');
    boardInner.innerHTML = `
      ${teacherBlock()}
      <div class="student-line">
        <div>
          <p class="student-name">${escapeHtml(d.name)}</p>
          ${d.groupName ? `<span class="group-chip">${escapeHtml(d.groupName)}</span>` : ''}
        </div>
        <button class="switch-btn" id="switchBtn" type="button">${icon('swap','s')}طالب آخر</button>
      </div>`;
    loadTeacherPhoto();
    document.getElementById('switchBtn').onclick = () => renderForm();
  }

  // ── شاشات الحالة ────────────────────────────────────────
  function renderForm(errorMsg){
    setBoardLogin();
    main.innerHTML = `
      <form class="panel" id="loginForm" autocomplete="off" novalidate>
        ${errorMsg ? `<div class="err" role="alert">${icon('alert','s')}<span>${escapeHtml(errorMsg)}</span></div>` : ''}
        <div class="field">
          <label for="codeInput">كود الطالب</label>
          <input id="codeInput" type="text" placeholder="مثلاً A05" autocapitalize="characters" autocomplete="off" enterkeyhint="${codeOnly ? 'go' : 'next'}">
          <p class="hint">الكود اللي المدرّس بعته لك.</p>
        </div>
        ${codeOnly ? '' : `<div class="field">
          <label for="phoneInput">آخر 4 أرقام من رقم ولي الأمر</label>
          <input id="phoneInput" type="tel" placeholder="1234" maxlength="8" inputmode="numeric" autocomplete="off" enterkeyhint="go">
        </div>`}
        <button class="btn" id="submitBtn" type="submit">عرض البيانات</button>
      </form>`;
    document.getElementById('loginForm').addEventListener('submit', (e) => { e.preventDefault(); handleSubmit(); });
  }
  function renderState(ic, title, sub){
    setBoardLogin();
    main.innerHTML = `<div class="panel state">${icon(ic)}<p>${title}</p><span>${sub}</span></div>`;
  }
  const renderNotFound = () => renderState('link', 'الرابط غير متاح', 'تأكد إنك فتحت الرابط الصحيح من المعلم.');
  const renderUnavailable = () => renderState('pause', 'الخدمة غير متاحة حاليًا', 'تواصل مع المعلم لتفعيل خدمة المتابعة.');

  async function handleSubmit(){
    const code = toLatinDigits(document.getElementById('codeInput').value).toUpperCase();
    const phoneEl = document.getElementById('phoneInput');
    const phoneAll = phoneEl ? toLatinDigits(phoneEl.value).replace(/\D/g, '') : '';
    const phone = phoneAll.slice(-4); // لو لصق الرقم كامل ناخد آخر 4 (زي التطبيق)
    if (!code) { renderForm('أدخل كود الطالب'); return; }
    if (!codeOnly && !/^\d{4}$/.test(phone)) { renderForm('أدخل آخر 4 أرقام صحيحة من رقم التليفون'); return; }

    main.innerHTML = '<div class="panel"><div class="spinner" role="status" aria-label="جاري التحميل"></div></div>';
    try {
      const docId = codeOnly ? code : `${code}_${phone}`;
      const data = await fetchDoc('parent_portal', slug, 'students', docId);
      if (!data) {
        renderForm(codeOnly ? 'الكود غير صحيح — تأكد من كود الطالب' : 'البيانات غير صحيحة — تأكد من الكود ورقم التليفون');
        return;
      }
      renderStudent(data);
    } catch (e) {
      renderForm('حصل خطأ — حاول تاني');
    }
  }

  // ── عناصر مساعدة للعرض ──────────────────────────────────
  const tray = (n, l, cls) => `<div class="tray ${cls}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const badge = (cls, ic, text) => `<span class="badge ${cls}">${icon(ic,'s')}${escapeHtml(text)}</span>`;

  function attBadge(a){
    if (a.status === 'متأخر') return badge('warn','clock','متأخر');
    if (a.status === 'حاضر') return badge('ok','check','حاضر');
    return badge('bad','x','غائب');
  }
  function hwBadge(h){
    const s = h.status;
    if (s === 'عمل' || s === 'تم الحل') return badge('ok','check','تم الحل');
    if (s === 'ناقص') return badge('warn','minus','ناقص');
    if (s === 'لم يعمل' || s === 'لم يُحل') return badge('bad','x','لم يُحل');
    return badge('info','minus','لم يُسجَّل');
  }
  function spark(vals, color){
    const w = 260, h = 34, n = vals.length;
    if (n < 2) return '';
    const x = (i) => (i * (w / (n - 1))).toFixed(1);
    const y = (v) => (h - 4 - (Math.max(0, Math.min(100, v)) / 100) * (h - 8)).toFixed(1);
    let paths = '', dots = '', seg = [];
    const flush = () => { if (seg.length > 1) paths += `<polyline fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="${seg.join(' ')}"/>`; seg = []; };
    vals.forEach((v, i) => { if (v == null) { flush(); return; } seg.push(`${x(i)},${y(v)}`); dots += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === n - 1 ? 3.4 : 2.4}" fill="${color}"/>`; });
    flush();
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true">${paths}${dots}</svg>`;
  }

  // ── نتيجة الطالب ────────────────────────────────────────
  function renderStudent(d){
    setBoardStudent(d);

    const price = Number(d.price) || 0;
    const exemptPercent = Number(d.exemptPercent) || 0;
    const effectivePrice = price * (1 - exemptPercent / 100);
    const totalPaid = Number(d.totalPaid) || 0;
    // d.remaining = المديونية المتراكمة المحسوبة في التطبيق. المستندات القديمة
    // مفيهاش الحقل → بنرجع للحساب المبسّط (شهر واحد − المدفوع).
    const remaining = (typeof d.remaining === 'number')
      ? Math.max(0, d.remaining)
      : Math.max(0, effectivePrice - totalPaid);
    const arr = (k) => Array.isArray(d[k]) ? d[k] : [];
    const attendanceHistory = arr('attendanceHistory');
    // إسقاط المديونية مش دفعة — نخفيه حتى في المستندات القديمة (اللي اتنشرت
    // قبل ما التطبيق يشيله بنفسه).
    const paymentHistory = arr('paymentHistory').filter(p => (p.note || '').trim() !== 'إسقاط مديونية');
    const homeworkHistory = arr('homeworkHistory');
    const examHistory = arr('examHistory');
    const recitationHistory = arr('recitationHistory');

    const present = Number(d.present) || 0, late = Number(d.late) || 0, absent = Number(d.absent) || 0;
    const total = present + absent;
    const rate = total ? Math.round(present / total * 100) : 0;

    // الحضور
    const attRows = attendanceHistory.length
      ? attendanceHistory.map(a => `<div class="row"><div><div class="d">${fmtDate(a.date)}</div>${a.guest ? '<div class="sub">حصة تعويضية</div>' : ''}</div>${attBadge(a)}</div>`).join('')
      : `<div class="empty">لا توجد سجلات حضور بعد</div>`;
    const attendanceTab = `
      <div class="panel">
        <div class="trays${late > 0 ? '' : ' two'}">
          ${tray(fmtMoney(present), 'حضر', 'ok')}
          ${late > 0 ? tray(fmtMoney(late), 'منهم متأخر', 'warn') : ''}
          ${tray(fmtMoney(absent), 'غاب', 'bad')}
        </div>
        ${total ? `<div class="bar" role="img" aria-label="نسبة الحضور ${rate}%"><i style="width:${rate}%"></i></div>
        <div class="bar-l"><span>نسبة الحضور</span><span>${fmtMoney(rate)}٪</span></div>` : ''}
      </div>
      <div class="panel"><p class="h">${icon('calendar','s')}آخر الحصص</p><div class="list">${attRows}</div></div>`;

    // المدفوعات
    const payRows = paymentHistory.length
      ? paymentHistory.map(p => `
          <div class="row">
            <div><div class="d">${fmtDate(p.date)}</div>${payNoteLabel(p.note) ? `<div class="sub">${escapeHtml(payNoteLabel(p.note))}</div>` : ''}</div>
            <span class="amount">${fmtMoney(p.amount)} جنيه</span>
          </div>`).join('')
      : `<div class="empty">لا توجد مدفوعات بعد</div>`;
    const showRemaining = effectivePrice > 0;
    // المذكرات: بطاقة جوّه تاب المدفوعات (مش تاب جديد — التابات الكتير بتتوّه
    // ولي الأمر). بتظهر بس لو الطالب عنده مذكرات.
    const booklets = arr('booklets');
    const bkRemaining = Number(d.bookletsRemaining) || 0;
    const bookletRows = booklets.map(b => {
      const rem = Number(b.remaining) || 0;
      return `
          <div class="row">
            <div><div class="d">${escapeHtml(b.name || 'مذكرة')}</div>
              <div class="sub">مدفوع ${fmtMoney(b.paid)} من ${fmtMoney(b.price)} جنيه · ${b.delivered ? 'تم التسليم' : 'لم تُسلَّم'}</div></div>
            ${rem > 0 ? `<span class="amount" style="color:var(--bad)">متبقي ${fmtMoney(rem)} جنيه</span>` : badge('ok','check','مدفوعة')}
          </div>`;
    }).join('');
    const bookletsPanel = booklets.length ? `
      <div class="panel">
        <p class="h">${icon('book','s')}المذكرات</p>
        <div class="balance" style="margin-bottom:4px">
          <div>
            <p class="lbl">${bkRemaining > 0 ? 'متبقي للمذكرات' : 'المذكرات'}</p>
            <p class="big" style="font-size:24px;color:${bkRemaining > 0 ? 'var(--bad)' : 'var(--ok)'}">${bkRemaining > 0 ? fmtMoney(bkRemaining) + ' <small>جنيه</small>' : 'مسدّدة بالكامل'}</p>
          </div>
        </div>
        <div class="list">${bookletRows}</div>
      </div>` : '';
    const paymentsTab = `
      <div class="panel">
        <div class="balance">
          <div>
            <p class="lbl">${showRemaining ? 'المتبقي' : 'إجمالي المدفوع'}</p>
            <p class="big" style="color:${showRemaining && remaining > 0 ? 'var(--bad)' : 'var(--ok)'}">${fmtMoney(showRemaining ? remaining : totalPaid)} <small>جنيه</small></p>
          </div>
          ${showRemaining ? `<div style="text-align:left"><p class="lbl">المدفوع</p><p class="big" style="font-size:20px">${fmtMoney(totalPaid)} <small>جنيه</small></p></div>` : ''}
        </div>
        ${showRemaining && remaining === 0 ? `<div class="exempt" style="color:var(--ok)">${icon('check','s')}مفيش مبالغ متبقية</div>` : ''}
        ${exemptPercent > 0 ? `<div class="exempt">${icon('heart','s')}إعفاء ${fmtMoney(exemptPercent)}٪</div>` : ''}
      </div>
      ${bookletsPanel}
      <div class="panel"><p class="h">${icon('wallet','s')}آخر المدفوعات</p><div class="list">${payRows}</div></div>`;

    // الواجب
    const hasHomework = (d.homeworkDone ?? 0) > 0 || (d.homeworkPartial ?? 0) > 0 || (d.homeworkNotDone ?? 0) > 0 || homeworkHistory.length > 0;
    const hwRows = homeworkHistory.length
      ? homeworkHistory.map(h => `<div class="row"><span class="d">${fmtDate(h.date)}</span>${hwBadge(h)}</div>`).join('')
      : `<div class="empty">لا توجد سجلات واجب بعد</div>`;
    const homeworkTab = `
      <div class="panel"><div class="trays">
        ${tray(fmtMoney(d.homeworkDone ?? 0), 'تم الحل', 'ok')}
        ${tray(fmtMoney(d.homeworkPartial ?? 0), 'ناقص', 'warn')}
        ${tray(fmtMoney(d.homeworkNotDone ?? 0), 'لم يُحل', 'bad')}
      </div></div>
      <div class="panel"><p class="h">${icon('book','s')}آخر الواجبات</p><div class="list">${hwRows}</div></div>`;

    // الامتحانات (+ التسميع)
    const hasExams = examHistory.length > 0;
    const hasRecitation = recitationHistory.length > 0 && typeof d.recitationAverage === 'number';
    const examRows = examHistory.map(e => `
        <div class="row">
          <div><div class="d">${escapeHtml(e.name || 'امتحان')}</div><div class="sub">${fmtDate(e.date)}</div></div>
          ${e.absent ? badge('bad','x','غائب') : `<span class="grade">${fmtNum(e.grade)}<small> / ${fmtNum(e.maxGrade)}</small></span>`}
        </div>`).join('');
    const recRows = recitationHistory.map(r => `
        <div class="row"><span class="d">${fmtDate(r.date)}</span>
        <span class="grade">${fmtNum(r.grade)}<small> / ${fmtNum(Number(r.max) || 10)}</small></span></div>`).join('');
    const examsTab = `
      ${hasExams ? `<div class="panel"><p class="h">${icon('file','s')}الامتحانات</p><div class="list">${examRows}</div></div>` : ''}
      ${hasRecitation ? `<div class="panel"><p class="h">${icon('mic','s')}التسميع</p>
        <div class="trays two" style="margin-bottom:6px">
          ${tray(fmtNum(d.recitationAverage) + ' / ' + fmtNum(Number(d.recitationMax) || 10), 'المتوسط', 'info')}
          ${tray(fmtMoney(d.recitationCount ?? recitationHistory.length), 'مرّة', 'info')}
        </div><div class="list">${recRows}</div></div>` : ''}`;

    // مستوى الطالب
    const perf = d.performance && Array.isArray(d.performance.indicators) ? d.performance : null;
    const hasPerf = !!(perf && perf.indicators.length);
    const perfColors = { exams:'var(--info)', attendance:'var(--ok)', homework:'var(--warn)', recitation:'var(--info)' };
    const trend = (t) => t === 'up' ? `<span class="up">${icon('arrowUp','s')}تحسّن</span>`
      : t === 'down' ? `<span class="down">${icon('arrowDown','s')}تراجع</span>`
      : t === 'steady' ? `<span>${icon('minus','s')}ثابت</span>` : '<span></span>';
    const fmtPct = (v) => v == null ? '—' : fmtNum(v) + '٪';
    const perfTab = hasPerf ? `<div class="panel">${perf.indicators.map(i => {
      const c = perfColors[i.kind] || 'var(--info)';
      const series = (perf.series && perf.series[i.kind]) || [];
      return `<div class="perf">
        <div class="perf-head"><b>${escapeHtml(i.label || '')}</b><span class="perf-pct">${fmtPct(i.percent)}</span></div>
        <div class="perf-meta">${trend(i.trend)}<span>${i.prev != null ? `السابق ${fmtPct(i.prev)} · ` : ''}${escapeHtml(i.level || '')}</span></div>
        ${spark(series, c)}
      </div>`;
    }).join('')}</div>` : '';

    const tabs = [
      { id:'att', label:'الحضور', ic:'calendar', html: attendanceTab },
      { id:'pay', label:'المدفوعات', ic:'wallet', html: paymentsTab },
    ];
    if (hasHomework) tabs.push({ id:'hw', label:'الواجب', ic:'book', html: homeworkTab });
    if (hasExams || hasRecitation) tabs.push({ id:'ex', label:'الامتحانات', ic:'file', html: examsTab });
    if (hasPerf) tabs.push({ id:'pf', label:'المستوى', ic:'chart', html: perfTab });

    main.innerHTML = `
      <div class="results">
        <nav class="tabs-wrap" aria-label="أقسام المتابعة">
          <div class="tabs" role="tablist" style="--n:${tabs.length}">
            ${tabs.map((t, i) => `<button class="tab" role="tab" id="tab-${t.id}" aria-controls="pn-${t.id}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}" type="button">${icon(t.ic)}<span>${t.label}</span></button>`).join('')}
          </div>
        </nav>
        ${tabs.map((t, i) => `<section class="tab-panel" role="tabpanel" id="pn-${t.id}" aria-labelledby="tab-${t.id}" ${i === 0 ? '' : 'hidden'}>${t.html}</section>`).join('')}
        <p class="foot">البيانات من آخر تحديث أرسله المدرّس.</p>
      </div>`;

    const btns = [...main.querySelectorAll('.tab')];
    const select = (btn, focus) => {
      btns.forEach(b => {
        const on = b === btn;
        b.setAttribute('aria-selected', on);
        b.tabIndex = on ? 0 : -1;
        document.getElementById(b.getAttribute('aria-controls')).hidden = !on;
      });
      window.scrollTo(0, 0);
      if (focus) btn.focus();
    };
    btns.forEach((b, i) => {
      b.onclick = () => select(b);
      b.onkeydown = (e) => {
        // الصفحة RTL: السهم اليمين = السابق
        const step = e.key === 'ArrowLeft' ? 1 : e.key === 'ArrowRight' ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        select(btns[(i + step + btns.length) % btns.length], true);
      };
    });
    window.scrollTo(0, 0);
  }

  // ── بدء التشغيل ─────────────────────────────────────────
  async function init(){
    if (!slug) { renderNotFound(); return; }
    try {
      const p = await fetchDoc('parent_portal', slug);
      if (p) {
        // البوابة اتعطّلت يدويًا من لوحة الأدمن (المستندات القديمة مفيهاش الحقل).
        if (p.active === false) { renderUnavailable(); return; }
        // مدة بوابة أولياء الأمور انتهت — نقفل الصفحة قبل فورم الكود.
        if (p.parentPortalExpiresAt && new Date(p.parentPortalExpiresAt) < new Date()) { renderUnavailable(); return; }

        codeOnly = p.loginMode === 'code_only';
        const title = p.teacherGender === 'female' ? 'مس' : 'مستر';
        if (p.teacherName) {
          teacher.name = `${title} ${p.teacherName}`;
          teacher.initial = (p.teacherName || '').trim().charAt(0);
          teacher.spec = (p.teacherSpecialization || '').toString().trim();
          teacher.photo = (p.teacherPhotoUrl || '').toString();
          window.__teacherName = teacher.name;
          document.getElementById('pageTitle').textContent = `متابعة الطلاب — ${teacher.name}`;
        }
      }
    } catch (e) {}
    renderForm();
  }

  init();
</script>
</body>
