<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title id="pageTitle">متابعة الطالب</title>
<link id="favicon" rel="icon" href="data:," />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#10B981;
    --primary-dark:#059669;
    --accent:#4F46E5;
    --bg-top:#ECFDF5;
    --bg-bottom:#F7F8FF;
    --card-bg:#FFFFFF;
    --text:#111827;
    --text-muted:#6B7280;
    --border:#E5E7EB;
    --danger:#EF4444;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;}
  body{
    font-family:'Cairo', sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 260px);
    min-height:100vh;
    width:100%;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 14px 60px;
  }
  .wrap{width:100%;max-width:460px;}

  .hero{text-align:center;margin-bottom:22px;}
  .hero-icon{
    width:60px;height:60px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;font-size:26px;color:#fff;
    box-shadow:0 8px 22px rgba(16,185,129,.3);
  }
  .hero-title{font-size:18px;font-weight:800;margin:0 0 4px;}
  .hero-sub{font-size:13px;color:var(--text-muted);margin:0;}

  .card{
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:0 12px 34px rgba(17,24,39,.07);
    border:1px solid var(--border);
    padding:22px;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);
    font-family:'Cairo';font-size:16px;background:#F9FAFB;
    text-align:center;letter-spacing:1px;
  }
  .field input:focus{outline:none;border-color:var(--primary);background:#fff;}
  .btn{
    width:100%;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;font-family:'Cairo';font-weight:800;font-size:15px;
    cursor:pointer;transition:opacity .15s,transform .1s;
  }
  .btn:disabled{opacity:.6;cursor:default;}
  .btn:not(:disabled):active{opacity:.85;transform:scale(.99);}
  .err{
    background:#FEF2F2;border:1px solid #FECACA;color:var(--danger);
    padding:10px 12px;border-radius:10px;font-size:12px;margin-bottom:14px;text-align:center;
  }

  /* ── ترحيب ولي الأمر ──────────────── */
  .welcome-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .avatar{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),#6366F1);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;
  }
  .welcome-title{font-size:13px;color:var(--text-muted);margin:0 0 2px;}
  .result-name{font-size:19px;font-weight:900;margin:0;}
  .result-group{
    display:inline-block;margin-top:4px;font-size:11px;font-weight:700;
    color:var(--accent);background:rgba(79,70,229,.08);
    padding:3px 10px;border-radius:20px;
  }

  .section-title{
    font-size:12px;font-weight:800;color:var(--text-muted);
    margin:20px 0 10px;display:flex;align-items:center;gap:6px;
  }
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{
    background:#F9FAFB;border-radius:14px;padding:14px 10px;text-align:center;
    border:1px solid var(--border);
  }
  .stat .n{font-size:24px;font-weight:900;}
  .stat .l{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .stat.present .n{color:var(--primary);}
  .stat.late .n{color:#F59E0B;}
  .stat.absent .n{color:var(--danger);}
  .stat.hw-done .n{color:#10B981;}
  .stat.hw-part .n{color:#F59E0B;}
  .stat.hw-not .n{color:#EF4444;}
  .stat-grid.hw3,.stat-grid.att3{grid-template-columns:1fr 1fr 1fr;}

  .money-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 14px;background:#F9FAFB;border-radius:12px;margin-bottom:8px;
    font-size:13px;border:1px solid var(--border);
  }
  .money-row b{font-size:15px;}
  .exempt-badge{
    display:inline-block;background:#ECFDF5;color:var(--primary-dark);
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-top:8px;
  }

  .history-list{display:flex;flex-direction:column;gap:6px;}
  .history-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;border-radius:10px;background:#F9FAFB;
    border:1px solid var(--border);font-size:12.5px;
  }
  .history-row .date{color:var(--text);font-weight:700;}
  .history-row .note{color:var(--text-muted);font-size:11px;margin-top:2px;}
  .badge-present{color:var(--primary-dark);font-weight:800;font-size:12px;}
  .badge-absent{color:var(--danger);font-weight:800;font-size:12px;}
  .badge-late{color:#B45309;font-weight:800;font-size:12px;}
  .badge-hw-done{color:var(--accent);font-weight:800;font-size:12px;}
  .badge-hw-not{color:#F59E0B;font-weight:800;font-size:12px;}
  .amount{color:var(--primary-dark);font-weight:800;font-size:13px;}
  .empty-hint{
    text-align:center;font-size:12px;color:var(--text-muted);
    padding:14px 0;
  }

  .back-btn{
    display:block;text-align:center;margin-top:18px;font-size:12px;color:var(--text-muted);
    text-decoration:none;cursor:pointer;
  }
  .spinner{
    width:26px;height:26px;border:3px solid #E5E7EB;border-top-color:var(--primary);
    border-radius:50%;animation:spin .7s linear infinite;margin:24px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-icon">🎓</div>
    <p class="hero-title" id="teacherTitle">متابعة الطالب</p>
    <p class="hero-sub" id="teacherSub">أدخل بيانات الطالب لعرض الحضور والمدفوعات</p>
  </div>
  <div class="card" id="card"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqFLZ4kHEgPLVgLgDGbbIjxnZheBqMjMc",
    authDomain: "active-class-72e0f.firebaseapp.com",
    projectId: "active-class-72e0f",
    storageBucket: "active-class-72e0f.firebasestorage.app",
    messagingSenderId: "822461821604",
    appId: "1:822461821604:web:3bd266a9833ce045916c31",
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const card = document.getElementById('card');
  const teacherTitle = document.getElementById('teacherTitle');
  const teacherSub = document.getElementById('teacherSub');
  const defaultTeacherSub = 'أدخل بيانات ابنك لعرض الحضور والمدفوعات';

  function getSlug() {
    const parts = window.location.pathname.split('/').filter(Boolean);
    const idx = parts.indexOf('track');
    if (idx !== -1 && parts[idx + 1]) return parts[idx + 1];
    return parts[parts.length - 1] || '';
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str ?? '';
    return d.innerHTML;
  }

  function fmtMoney(n){
    return (n ?? 0).toLocaleString('ar-EG', { maximumFractionDigits: 0 });
  }

  function fmtDate(iso){
    try {
      return new Date(iso).toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) { return iso; }
  }

  const slug = getSlug();

  function renderForm(errorMsg){
    teacherTitle.textContent = window.__teacherName || 'متابعة الطالب';
    teacherSub.textContent = defaultTeacherSub;
    card.innerHTML = `
      ${errorMsg ? `<div class="err">${escapeHtml(errorMsg)}</div>` : ''}
      <div class="field">
        <label>كود الطالب</label>
        <input id="codeInput" type="text" placeholder="مثلاً A05" autocapitalize="characters">
      </div>
      <div class="field">
        <label>آخر 4 أرقام من رقم تليفون ولي الأمر</label>
        <input id="phoneInput" type="tel" placeholder="1234" maxlength="4" inputmode="numeric">
      </div>
      <button class="btn" id="submitBtn">عرض البيانات</button>
    `;
    document.getElementById('submitBtn').onclick = handleSubmit;
    document.getElementById('phoneInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSubmit();
    });
  }

  function renderNotFound(){
    card.innerHTML = `
      <div style="text-align:center;padding:10px;">
        <div style="font-size:32px;margin-bottom:8px;">🔗</div>
        <p style="font-weight:800;margin:0 0 4px;">الرابط غير متاح</p>
        <p style="font-size:12px;color:var(--text-muted);">تأكد إنك فتحت الرابط الصحيح من المعلم.</p>
      </div>`;
  }

  function renderUnavailable(){
    card.innerHTML = `
      <div style="text-align:center;padding:10px;">
        <div style="font-size:32px;margin-bottom:8px;">⏸️</div>
        <p style="font-weight:800;margin:0 0 4px;">الخدمة دي غير متاحة حاليًا</p>
        <p style="font-size:12px;color:var(--text-muted);">تواصل مع المعلم لتفعيل خدمة المتابعة.</p>
      </div>`;
  }

  async function handleSubmit(){
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    const phone = document.getElementById('phoneInput').value.trim();
    if (!code) { renderForm('أدخل كود الطالب'); return; }
    if (!/^\d{4}$/.test(phone)) { renderForm('أدخل آخر 4 أرقام صحيحة من رقم التليفون'); return; }

    card.innerHTML = '<div class="spinner"></div>';
    try {
      const docId = `${code}_${phone}`;
      const snap = await getDoc(doc(db, 'parent_portal', slug, 'students', docId));
      if (!snap.exists()) {
        renderForm('البيانات غير صحيحة — تأكد من الكود ورقم التليفون');
        return;
      }
      renderStudent(snap.data());
    } catch (e) {
      renderForm('حصل خطأ — حاول تاني');
    }
  }

  function renderStudent(d){
    const price = Number(d.price) || 0;
    const exemptPercent = Number(d.exemptPercent) || 0;
    const effectivePrice = price * (1 - exemptPercent / 100);
    const totalPaid = Number(d.totalPaid) || 0;
    const remaining = Math.max(0, effectivePrice - totalPaid);
    const initial = (d.name || '؟').trim().charAt(0);
    const attendanceHistory = Array.isArray(d.attendanceHistory) ? d.attendanceHistory : [];
    const paymentHistory = Array.isArray(d.paymentHistory) ? d.paymentHistory : [];
    const homeworkHistory = Array.isArray(d.homeworkHistory) ? d.homeworkHistory : [];

    teacherTitle.textContent = `أهلًا بك، ولي أمر ${d.name}`;
    teacherSub.textContent = 'تابع حضور ومدفوعات ابنك أول بأول';

    // حالة الحضور: حاضر / متأخر / غائب. القيم القديمة مدعومة.
    const attLabel = (a) => {
      if (a.statusLabel) return a.statusLabel;
      if (a.status === 'متأخر') return '⏰ متأخر';
      if (a.status === 'حاضر') return '✅ حاضر';
      return '❌ غائب';
    };
    const attClass = (a) => {
      if (a.status === 'متأخر') return 'badge-late';
      if (a.status === 'حاضر') return 'badge-present';
      return 'badge-absent';
    };
    const attendanceRows = attendanceHistory.length
      ? attendanceHistory.map(a => `
          <div class="history-row">
            <span class="date">${fmtDate(a.date)}</span>
            <span class="${attClass(a)}">${attLabel(a)}</span>
          </div>`).join('')
      : `<div class="empty-hint">لا توجد سجلات حضور بعد</div>`;

    const paymentRows = paymentHistory.length
      ? paymentHistory.map(p => `
          <div class="history-row">
            <div>
              <div class="date">${fmtDate(p.date)}</div>
              ${p.note ? `<div class="note">${escapeHtml(p.note)}</div>` : ''}
            </div>
            <span class="amount">${fmtMoney(p.amount)} جنيه</span>
          </div>`).join('')
      : `<div class="empty-hint">لا توجد مدفوعات بعد</div>`;

    // حالة الواجب: عمل=تم الحل، ناقص، لم يعمل=لم يُحل. القيم القديمة مدعومة.
    const hwLabel = (h) => {
      if (h.statusLabel) return h.statusLabel;
      const s = h.status;
      if (s === 'عمل' || s === 'تم الحل') return '🟢 تم الحل';
      if (s === 'ناقص') return '🟡 ناقص';
      if (s === 'لم يعمل' || s === 'لم يُحل') return '🔴 لم يُحل';
      return 'لم يُسجَّل';
    };
    const hwClass = (h) => {
      const s = h.status;
      if (s === 'لم يعمل' || s === 'لم يُحل') return 'badge-hw-not';
      return 'badge-hw-done';
    };
    const homeworkRows = homeworkHistory.length
      ? homeworkHistory.map(h => `
          <div class="history-row">
            <span class="date">${fmtDate(h.date)}</span>
            <span class="${hwClass(h)}">${hwLabel(h)}</span>
          </div>`).join('')
      : `<div class="empty-hint">لا توجد سجلات واجب بعد</div>`;

    const hasHomework = (d.homeworkDone ?? 0) > 0 || (d.homeworkPartial ?? 0) > 0 || (d.homeworkNotDone ?? 0) > 0 || homeworkHistory.length > 0;

    card.innerHTML = `
      <div class="welcome-row">
        <div class="avatar">${escapeHtml(initial)}</div>
        <div>
          <p class="welcome-title">بيانات الطالب</p>
          <p class="result-name">${escapeHtml(d.name)}</p>
          ${d.groupName ? `<span class="result-group">${escapeHtml(d.groupName)}</span>` : ''}
        </div>
      </div>

      <div class="stat-grid${(d.late ?? 0) > 0 ? ' att3' : ''}">
        <div class="stat present"><div class="n">${d.present ?? 0}</div><div class="l">حصص حاضرة</div></div>
        ${(d.late ?? 0) > 0 ? `<div class="stat late"><div class="n">${d.late}</div><div class="l">منها متأخر</div></div>` : ''}
        <div class="stat absent"><div class="n">${d.absent ?? 0}</div><div class="l">حصص غائبة</div></div>
      </div>

      <div class="section-title">💰 الحالة المالية</div>
      <div class="money-row"><span>إجمالي المدفوع</span><b>${fmtMoney(totalPaid)} جنيه</b></div>
      ${effectivePrice > 0 ? `<div class="money-row"><span>المتبقي</span><b style="color:${remaining > 0 ? 'var(--danger)' : 'var(--primary-dark)'}">${fmtMoney(remaining)} جنيه</b></div>` : ''}
      ${exemptPercent > 0 ? `<div style="text-align:center;"><span class="exempt-badge">🎗️ إعفاء ${exemptPercent}%</span></div>` : ''}

      <div class="section-title">🧾 آخر المدفوعات</div>
      <div class="history-list">${paymentRows}</div>

      <div class="section-title">📅 آخر الحصص</div>
      <div class="history-list">${attendanceRows}</div>

      ${hasHomework ? `
      <div class="stat-grid hw3" style="margin-top:20px;">
        <div class="stat hw-done"><div class="n">${d.homeworkDone ?? 0}</div><div class="l">🟢 تم الحل</div></div>
        <div class="stat hw-part"><div class="n">${d.homeworkPartial ?? 0}</div><div class="l">🟡 ناقص</div></div>
        <div class="stat hw-not"><div class="n">${d.homeworkNotDone ?? 0}</div><div class="l">🔴 لم يُحل</div></div>
      </div>

      <div class="section-title">📖 آخر الواجبات</div>
      <div class="history-list">${homeworkRows}</div>
      ` : ''}

      <a class="back-btn" id="backBtn">🔍 البحث عن طالب تاني</a>
    `;
    document.getElementById('backBtn').onclick = () => renderForm();
  }

  async function init(){
    if (!slug) { renderNotFound(); return; }
    try {
      const profileSnap = await getDoc(doc(db, 'parent_portal', slug));
      if (profileSnap.exists()) {
        const p = profileSnap.data();

        // بوابة أولياء الأمور دي مدتها المستقلة (لو محددة) انتهت —
        // نقفل الصفحة بالكامل قبل حتى عرض فورم إدخال الكود، بدل ما
        // نعرض بيانات طالب قديمة ممكن توهم ولي الأمر إنها حالية.
        if (p.parentPortalExpiresAt && new Date(p.parentPortalExpiresAt) < new Date()) {
          renderUnavailable();
          return;
        }

        const title = p.teacherGender === 'female' ? 'مس' : 'مستر';
        const name = p.teacherName ? `${title} ${p.teacherName}` : '';
        if (name) {
          window.__teacherName = name;
          document.getElementById('pageTitle').textContent = `متابعة الطلاب — ${name}`;
        }
      }
    } catch (e) {}
    renderForm();
  }

  init();
</script>
</body>
</html>
