# supabase/docker/docker-compose.yml
#
# Supabase مستضاف ذاتيًا — Postgres + Auth + PostgREST (REST) +
# Realtime + Kong كبوابة API. تُستخدم من نظام تسجيل الدخول المستقل
# ومن "وضع الفريق" (مزامنة بيانات المدرس/المساعدين). Storage مش
# مستخدمة حاليًا.
#
# الاستخدام:
#   cp .env.example .env   # واملأ القيم (راجع دليل النشر لتوليدها)
#   docker compose up -d
#   docker compose exec db psql -U postgres -d postgres -f /schema.sql

name: active-class-auth

services:
  db:
    image: supabase/postgres:15.6.1.143
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../schema.sql:/schema.sql:ro
    # مفيش داعي نفتح 5432 على الإنترنت — الاتصال بين الحاويات (auth
    # <-> db) بيحصل داخليًا على شبكة Docker، ومفيش حد بره محتاج يوصل
    # لقاعدة البيانات مباشرة. ده كمان بيتجنب تعارض مع أي Postgres تاني
    # شغال على نفس البورت على السيرفر.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated

      # مفيش بريد حقيقي وراء العناوين الصناعية (<phone>@app.local) —
      # نعدّي خطوة تأكيد البريد تلقائيًا.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

      # مش بنستخدم تسجيل دخول بالتليفون عبر SMS/OTP فعليًا — رقم
      # التليفون بيتحوّل لبريد صناعي جوه التطبيق نفسه (auth_service.dart).
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # اسم الخدمة لازم يكون "realtime-dev" بالظبط — Realtime بيحدّد الـ
  # tenant من الـ Host header اللي Kong بيبعته للـ upstream (بيساوي
  # اسم الخدمة افتراضيًا)، والـ seed التلقائي (SEED_SELF_HOST) بيعمل
  # الـ tenant باسم "realtime-dev" ثابت — أي اسم تاني هيسبب "Tenant
  # not found" دايمًا.
  realtime-dev:
    image: supabase/realtime:v2.34.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${JWT_SECRET}${JWT_SECRET}
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  kong:
    image: kong:3.6
    restart: unless-stopped
    depends_on:
      - auth
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000"

  # ── (اختياري) لوحة إدارة لمراجعة المستخدمين يدويًا ─────────────────
  # فعّلها بـ: docker compose --profile studio up -d
  studio:
    image: supabase/studio:latest
    restart: unless-stopped
    profiles: ["studio"]
    depends_on:
      - kong
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DEFAULT_ORGANIZATION_NAME: "Active Class"
      DEFAULT_PROJECT_NAME: "auth"
    ports:
      - "3000:3000"

volumes:
  db-data:
